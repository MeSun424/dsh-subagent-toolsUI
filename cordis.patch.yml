# dsh-subagent-tools-ui bundle patch.
#
# Installs the process-level session-lock service and Web client. The service
# wraps official `subagent` / `subagent_fork` tools and `subagents.start*`.
# It does not replace @deepseek-ai/dsh-tool-subagent or rewrite agent presets.
#
# Install: dsh plugin --profile web add <this package>
# Restart `dsh --profile web` after installing.

- insert:
    - id: subagent-tools-service
      name: dsh-subagent-tools-ui
